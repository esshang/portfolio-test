<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#e8e7e4; --bar:#f4f3f1; --ink:#1c1c1b; --mute:#7a7975; --line:#d3d2ce; --paper:#fff; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1a1a19; --bar:#222221; --ink:#ecebe8; --mute:#8d8c88; --line:#383836; }
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font:400 14px/1.4 "Hanken Grotesk",system-ui,sans-serif}
  body.flip{overflow:hidden}

  header{position:fixed;inset:0 0 auto 0;height:52px;z-index:10;display:flex;align-items:center;gap:12px;
    padding:0 16px;background:var(--bar);border-bottom:1px solid var(--line)}
  #title{font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #count{color:var(--mute);font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  button{font:inherit;color:var(--ink);background:none;border:0;padding:7px 12px;cursor:pointer}
  button:hover{background:var(--bg)}
  button[aria-pressed="true"]{background:var(--ink);color:var(--bar)}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
  .flip-only{display:none}
  body.flip .flip-only{display:inline-block}
  #count{white-space:nowrap}
  @media (max-width:760px){
    header{gap:6px;padding:0 10px}
    #title,#fs,#prev,#next{display:none!important}
    #count{margin-left:auto;min-width:0}
    button{padding:7px 10px}
  }

  /* flip view */
  #stage{display:none;position:fixed;inset:52px 0 96px 0;overflow:hidden}
  body.flip #stage{display:block}
  #bookwrap{position:absolute;left:50%;top:50%;transition:transform .45s ease}
  #book{position:relative;transform-origin:center}
  #book .turn-page{background:var(--paper)}
  #book .p img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none;user-select:none}
  #book{cursor:grab}

  /* thumbnail strip */
  #strip{display:none;position:fixed;inset:auto 0 0 0;height:96px;padding:12px 16px;gap:10px;overflow-x:auto;
    background:var(--bar);border-top:1px solid var(--line);align-items:center}
  body.flip #strip{display:flex}
  .t{flex:none;display:flex;gap:1px;padding:2px;border:2px solid transparent;border-radius:3px;cursor:pointer;background:none}
  .t img{height:56px;width:56px;display:block;object-fit:cover}
  .t[aria-current="true"]{border-color:var(--ink)}
  .t:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* scroll view */
  #scroll{display:none;max-width:1400px;margin:0 auto;padding:84px 24px 80px}
  body.scroll #scroll{display:block}
  #scroll img{display:block;width:100%;height:auto;aspect-ratio:1/1;background:var(--paper);margin:0 0 20px}
  @media (max-width:600px){#scroll{padding:64px 0 40px}#scroll img{margin-bottom:8px}}

  /* zoom */
  #lb{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;cursor:zoom-out}
  #lb.on{display:block}
  #lb .in{display:flex;min-width:min-content}
  #lb img{display:block;width:auto;max-width:none;height:auto}
  #lbclose{position:fixed;top:12px;right:16px;background:var(--bar);border:1px solid var(--line);border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="flip">
<header>
  <div id="title">Portfolio</div>
  <button id="prev" class="flip-only" aria-label="Previous">Prev</button>
  <button id="next" class="flip-only" aria-label="Next">Next</button>
  <button id="zoom" class="flip-only" aria-label="Zoom in on the current pages">Zoom</button>
  <div id="count"></div>
  <div class="seg" role="group" aria-label="View mode">
    <button id="m-flip" aria-pressed="true">Flipbook</button>
    <button id="m-scroll" aria-pressed="false">Scroll</button>
  </div>
  <button id="fs" aria-label="Fullscreen">Fullscreen</button>
</header>

<div id="stage"><div id="bookwrap"><div id="book"></div></div></div>
<div id="strip" role="list" aria-label="Pages"></div>
<div id="scroll"></div>
<div id="lb"><button id="lbclose">Close</button><div class="in"></div></div>

<script src="jquery.min.js"></script>
<script src="turn.min.js"></script>
<script>
// ---- Settings ----
var TITLE = "Portfolio";   // shown in the top bar
var TOTAL = 36;            // number of pages (1.jpg ... 36.jpg)
// Three sizes per page: N-thumb.jpg (strip), N-m.jpg (flipping), N.jpg (zoom)
// ------------------

var DIR = "pages/";        // folder holding the images; use "" if they sit beside index.html
var large = function(n){ return DIR + n + ".jpg"; };
var med   = function(n){ return DIR + n + "-m.jpg"; };
var thumb = function(n){ return DIR + n + "-thumb.jpg"; };
var $book = $("#book"), $wrap = $("#bookwrap");
document.title = TITLE; $("#title").text(TITLE);

// spreads (1-based): cover alone, then pairs, last page alone if the count is even
var SP = [[1]];
for (var i = 2; i <= TOTAL; i += 2) SP.push(i + 1 <= TOTAL ? [i, i + 1] : [i]);
function spreadOf(p){ for (var k = 0; k < SP.length; k++) if (SP[k].indexOf(p) > -1) return k; return 0; }

// ----- build pages -----
// Turn.js keeps only a few pages in the DOM at a time, so keep a reference to every
// page's <img> by number instead of looking pages up by position.
var imgs = {};
for (var n = 1; n <= TOTAL; n++) {
  var el = $('<div class="p"><img alt="Page ' + n + '" draggable="false"></div>');
  imgs[n] = el.find("img")[0];
  $book.append(el);
}
function load(n){
  var im = imgs[n];
  if (im && !im.getAttribute("src")) im.src = med(n);
}
function loadAround(p){ for (var k = p - 3; k <= p + 5; k++) load(k); }

// ----- sizing -----
function isSingle(){ return window.innerWidth < 760; }
function dims(){
  var aw = window.innerWidth - 48, ah = window.innerHeight - 52 - 96 - 32, s;
  if (isSingle()) { s = Math.max(200, Math.min(aw, ah)); return {w: s, h: s}; }
  s = Math.max(200, Math.min(aw / 2, ah)); return {w: Math.round(s * 2), h: Math.round(s)};
}
function place(view){
  // r3 has no auto-centering: slide the book so a lone cover / last page sits in the middle
  var d = dims(), shift = 0;
  if (!isSingle() && view) {
    if (view[0] === 0) shift = -d.w / 4;
    else if (view[1] === 0 || view[1] > TOTAL) shift = d.w / 4;
  }
  $wrap.css({width: d.w, height: d.h, marginLeft: -d.w / 2, marginTop: -d.h / 2,
             transform: "translateX(" + shift + "px)"});
}

// ----- UI state -----
function labelOf(view){
  var v = view.filter(function(x){ return x > 0 && x <= TOTAL; });
  return (v.length === 1 ? v[0] : v[0] + "–" + v[1]) + " / " + TOTAL;
}
function updateUI(view){
  $("#count").text(labelOf(view));
  var cur = spreadOf(view.filter(Boolean)[0] || 1);
  $("#strip").children().each(function(k){
    this.setAttribute("aria-current", k === cur);
    if (k === cur && this.scrollIntoView) this.scrollIntoView({inline: "center", block: "nearest"});
  });
}
function buildStrip(){
  SP.forEach(function(s){
    var b = $('<button class="t" role="listitem"></button>');
    b.attr("aria-label", "Pages " + (s.length === 1 ? s[0] : s[0] + " to " + s[1]));
    s.forEach(function(p){ b.append($('<img alt="" loading="lazy">').attr("src", thumb(p))); });
    b.on("click", function(){ $book.turn("page", s[0]); });
    $("#strip").append(b);
  });
}

// ----- flipbook -----
var d0 = dims();
$wrap.css({width: d0.w, height: d0.h});
$book.css({width: d0.w, height: d0.h});
$book.turn({
  width: d0.w, height: d0.h,
  display: isSingle() ? "single" : "double",
  duration: 900,
  gradients: !("ontouchstart" in window),
  acceleration: !window.chrome,   // Chrome renders the page text softer with 3D acceleration on
  elevation: 50,
  when: {
    turning: function(e, page){
      loadAround(page);
      place($book.turn("view", page));
    },
    turned: function(e, page){
      var v = $book.turn("view");
      loadAround(page); place(v); updateUI(v);
    }
  }
});
loadAround(1); place($book.turn("view")); updateUI($book.turn("view"));

function resize(){
  var d = dims();
  $book.turn("display", isSingle() ? "single" : "double");
  $book.turn("size", d.w, d.h);
  place($book.turn("view"));
}

// ----- scroll view -----
function buildScroll(){
  var sc = $("#scroll");
  for (var n = 1; n <= TOTAL; n++) sc.append($('<img alt="Page ' + n + '" loading="lazy">').attr("src", med(n)));
}

function setMode(mode){
  $("body").toggleClass("flip", mode === "flip").toggleClass("scroll", mode === "scroll");
  $("#m-flip").attr("aria-pressed", mode === "flip");
  $("#m-scroll").attr("aria-pressed", mode === "scroll");
  var u = new URL(location); u.searchParams.set("view", mode); history.replaceState(null, "", u);
  if (mode === "flip") { resize(); updateUI($book.turn("view")); }
  else { window.scrollTo(0, 0); $("#count").text(TOTAL + " pages"); }
}

// ----- zoom (loads the large image only when asked) -----
function openZoom(){
  var v = $book.turn("view").filter(function(x){ return x > 0 && x <= TOTAL; });
  var box = $("#lb .in").empty();
  v.forEach(function(p){ box.append($("<img>").attr("src", large(p))); });
  $("#lb").addClass("on").scrollTop(0).scrollLeft(0);
}
function closeZoom(){ $("#lb").removeClass("on"); }

$("#m-flip").on("click", function(){ setMode("flip"); });
$("#m-scroll").on("click", function(){ setMode("scroll"); });
$("#prev").on("click", function(){ $book.turn("previous"); });
$("#next").on("click", function(){ $book.turn("next"); });
$("#zoom").on("click", openZoom);
$book.on("dblclick", openZoom);
$("#lb").on("click", closeZoom);
$("#fs").on("click", function(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
});
$(window).on("resize orientationchange", function(){ if ($("body").hasClass("flip")) resize(); });
$(window).on("keydown", function(e){
  if (e.keyCode === 27) closeZoom();
  if (!$("body").hasClass("flip") || $("#lb").hasClass("on")) return;
  if (e.keyCode === 37) { $book.turn("previous"); e.preventDefault(); }
  if (e.keyCode === 39) { $book.turn("next"); e.preventDefault(); }
});

buildStrip(); buildScroll();
setMode(new URLSearchParams(location.search).get("view") === "scroll" ? "scroll" : "flip");
</script>
</body>
</html>
